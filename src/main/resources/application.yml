spring:
  profiles:
    active: dev

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://localhost:5432/settler
    username: settler
    password: devpass
    driver-class-name: org.postgresql.Driver
    hikari:
      register-mbeans: false
      pool-name: HikariPool-1
      auto-commit: true

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        jdbc.time_zone: UTC
        format_sql: true
        show_sql: true
        use_sql_comments: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true
    validate-on-migrate: true
    repair-before-migrate: true
    schemas: public

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    org.springframework.web: info
    com.settler: debug

jwt:
  secret: "SETTLER_SUPER_SECRET_KEY_1234567890"
  expiration-ms: 7776000000
  refresh-expiry-days: 30 # correct comment here -> 90 days
otp:
  expiry-minutes: 5        # how long OTP is valid

lifecycle:
  timeout-per-shutdown-phase: 10s
